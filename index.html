<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parola — Italian word notebook</title>
<meta name="theme-color" content="#13294B">
<meta name="description" content="Italian dictionary, homework corrector and flashcards for Spanish speakers.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Parola">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Parola <i>quaderno</i></div>
    <div style="display:flex;gap:10px;align-items:center"><div class="count" id="count"></div><button class="gear" id="gear" type="button">Settings</button></div>
  </header>

  <!-- LOOKUP -->
  <section id="view-look">
    <form class="search" id="form" autocomplete="off">
      <input id="q" type="search" placeholder="Type an Italian word or phrase…" aria-label="Word to look up" enterkeyhint="search">
      <button class="btn" id="go" type="submit">Look up</button>
    </form>
    <p class="hint">You can also type a Spanish word to find the Italian one.</p>
    <div class="chips" id="tries"></div>
    <div id="out"></div>
  </section>

  <!-- CORRECT -->
  <section id="view-correct" hidden>
    <textarea class="essay" id="essay" placeholder="Paste or write your Italian text here…" aria-label="Your Italian text"></textarea>
    <div class="bar">
      <div class="grow" id="wc"></div>
      <button class="btn ghost" id="clear" type="button">Clear</button>
      <button class="btn" id="check" type="button">Correct</button>
    </div>
    <div id="corr"></div>
  </section>

  <!-- SAVED -->
  <section id="view-saved" hidden>
    <div class="tools">
      <button class="btn ghost" id="export" type="button">Export words</button>
      <button class="btn ghost" id="import" type="button">Import words</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
    <input class="filter" id="filter" type="search" placeholder="Filter saved words" aria-label="Filter saved words">
    <div id="list"></div>
  </section>

  <!-- SETTINGS -->
  <section id="view-settings" hidden>
    <div class="panel">
      <h2>AI connection</h2>
      <p class="meta">Parola uses your own API key. It stays on this device and is only sent to the provider you choose.</p>
      <label class="field"><span>Provider</span>
        <select id="prov">
          <option value="gemini">Google Gemini (free tier)</option>
          <option value="groq">Groq (free tier)</option>
          <option value="openrouter">OpenRouter</option>
          <option value="openai">OpenAI</option>
          <option value="anthropic">Anthropic (Claude)</option>
          <option value="custom">Custom (OpenAI-compatible, e.g. Ollama)</option>
        </select>
        <small id="provHelp"></small>
      </label>
      <label class="field"><span>API key</span>
        <input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="Paste your key">
      </label>
      <label class="field"><span>Model</span>
        <div style="display:flex;gap:8px">
          <input id="model" type="text" autocomplete="off" spellcheck="false" list="modelList" style="flex:1;min-width:0">
          <button class="btn ghost" id="findModels" type="button">Find models</button>
        </div>
        <datalist id="modelList"></datalist>
        <small id="modelHelp">Tap Find models to see the exact names your key can use, then pick one.</small>
      </label>
      <label class="field" id="baseWrap" hidden><span>Base URL</span>
        <input id="base" type="url" autocomplete="off" spellcheck="false" placeholder="http://localhost:11434/v1">
      </label>
      <div class="bar">
        <div class="grow" id="testOut"></div>
        <button class="btn ghost" id="test" type="button">Test</button>
        <button class="btn" id="saveSet" type="button">Save</button>
      </div>
    </div>
  </section>

  <!-- PRACTICE -->
  <section id="view-practice" hidden>
    <div class="modes" role="group" aria-label="Practice direction">
      <button data-mode="it" aria-pressed="true">Italian → Spanish</button>
      <button data-mode="es" aria-pressed="false">Spanish → Italian</button>
    </div>
    <div id="deck"></div>
  </section>
</div>

<nav class="tabs" role="tablist">
  <div class="in">
    <button role="tab" data-tab="look" aria-selected="true">Look up</button>
    <button role="tab" data-tab="correct" aria-selected="false">Correct</button>
    <button role="tab" data-tab="saved" aria-selected="false">Saved</button>
    <button role="tab" data-tab="practice" aria-selected="false">Practice</button>
  </div>
</nav>
<div class="toast" id="toast" role="status"></div>

<!-- Load order matters: settings and prompts first, then the app that uses them -->
<script src="config.js"></script>
<script src="prompts.js"></script>
<script src="app.js"></script>
</body>
</html>
