<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parola — Italian word notebook</title>
<meta name="theme-color" content="#13294B">
<meta name="description" content="Italian dictionary, homework corrector and flashcards for Spanish speakers.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Parola">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF3F7; --card:#FFFFFF; --ink:#13294B; --ink-soft:#4A5D7A; --line:#D3DEE8;
  --lemon:#F2C230; --lemon-soft:#FFF4C7; --leaf:#2F7D5B; --warn:#B4442F; --warn-soft:#FBE9E4;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1A2E; --card:#16263F; --ink:#E8EEF6; --ink-soft:#9DB0CA; --line:#2A3E5C;
    --lemon:#F2C230; --lemon-soft:#3A3417; --leaf:#6CC49B; --warn:#F08A72; --warn-soft:#3B2220;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1A2E; --card:#16263F; --ink:#E8EEF6; --ink-soft:#9DB0CA; --line:#2A3E5C;
  --lemon:#F2C230; --lemon-soft:#3A3417; --leaf:#6CC49B; --warn:#F08A72; --warn-soft:#3B2220;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:20px 18px 110px}
header.top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}
.brand{font-family:"Instrument Serif",Georgia,serif;font-size:2.1rem;line-height:1;letter-spacing:-.01em}
.brand i{color:var(--ink-soft)}
.count{font-size:.85rem;color:var(--ink-soft)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--lemon);outline-offset:2px;border-radius:6px}

/* search */
.search{display:flex;gap:8px;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:6px 6px 6px 14px}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:1.1rem;outline:none}
.search input::placeholder{color:var(--ink-soft)}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.lemon{background:var(--lemon);color:#13294B}
.hint{font-size:.88rem;color:var(--ink-soft);margin:10px 2px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:.88rem}

/* entry */
.entry{background:var(--card);border-radius:18px;margin-top:22px;padding:22px 20px;border:1px solid var(--line)}
.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.word{font-family:"Instrument Serif",Georgia,serif;font-size:2.8rem;line-height:1;margin:0;word-break:break-word}
.meta{color:var(--ink-soft);font-size:.92rem;margin-top:6px}
.reg{display:inline-block;background:var(--lemon-soft);border-radius:6px;padding:1px 8px;font-size:.82rem;font-weight:600;margin-left:6px;color:var(--ink)}
.def{font-family:"Instrument Serif",Georgia,serif;font-size:1.3rem;line-height:1.45;margin:16px 0 4px}
.def-es{color:var(--ink-soft);font-size:.95rem;margin:0}
.sec{margin-top:20px}
.sec h3{font-size:.95rem;font-weight:700;margin:0 0 8px}
.tr{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:1rem}
.tr b{font-weight:600;color:var(--ink-soft)}
.ex{border-left:3px solid var(--lemon);padding:2px 0 2px 12px;margin:0 0 10px}
.ex .it{font-weight:500}
.ex .es{color:var(--ink-soft);font-size:.92rem}
.idiom{margin:0 0 10px}
.idiom .it{font-family:"Instrument Serif",Georgia,serif;font-size:1.2rem;font-style:italic}
.idiom .es{color:var(--ink-soft);font-size:.92rem}
.ff{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;margin-top:18px;font-size:.95rem}
.ff strong{display:block}
.link{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-decoration-color:var(--lemon);text-decoration-thickness:2px;text-underline-offset:3px}
.status{margin-top:22px;color:var(--ink-soft)}
.ext{display:flex;flex-wrap:wrap;gap:8px}
.ext a{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:10px;padding:7px 12px;font-size:.9rem;font-weight:600;color:var(--ink);text-decoration:none;background:var(--card)}
.ext a:hover{border-color:var(--ink)}
.ext a::after{content:"↗";font-weight:400;color:var(--ink-soft)}
.err{color:var(--warn)}

/* saved list */
.filter{width:100%;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;padding:10px 14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.row .w{font-family:"Instrument Serif",Georgia,serif;font-size:1.4rem;line-height:1.1}
.row .t{color:var(--ink-soft);font-size:.9rem}
.row .grow{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0}
.dots{display:flex;gap:3px}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--leaf)}
.x{background:none;border:0;color:var(--ink-soft);font-size:1.2rem;padding:4px 8px}
.empty{text-align:center;padding:40px 10px;color:var(--ink-soft)}
.empty .big{font-family:"Instrument Serif",Georgia,serif;font-size:1.6rem;color:var(--ink);margin-bottom:6px}

/* practice */
.modes{display:flex;gap:8px;margin-bottom:16px}
.modes button{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:9px;font-weight:600;font-size:.92rem}
.modes button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.flash{background:var(--card);border:2px solid var(--ink);border-radius:22px;min-height:300px;padding:28px 22px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.flash .q{font-family:"Instrument Serif",Georgia,serif;font-size:2.6rem;line-height:1.1;word-break:break-word}
.flash .sub{color:var(--ink-soft);margin-top:10px}
.flash .a{margin-top:20px;padding-top:18px;border-top:1px dashed var(--line)}
.flash .a .main{font-size:1.25rem;font-weight:600}
.flash .a .ex{text-align:left;margin-top:12px}
.acts{display:flex;gap:10px;margin-top:16px}
.acts .btn{flex:1;padding:14px}
.progress{font-size:.88rem;color:var(--ink-soft);text-align:center;margin-top:12px}

/* correct */
.essay{width:100%;min-height:200px;resize:vertical;border:2px solid var(--ink);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;font-size:1.05rem;line-height:1.6;padding:14px 16px}
.essay::placeholder{color:var(--ink-soft)}
.bar{display:flex;gap:8px;align-items:center;margin-top:10px}
.bar .grow{flex:1;font-size:.85rem;color:var(--ink-soft)}
.marked{font-size:1.08rem;line-height:1.8;white-space:pre-wrap;margin:0}
.marked strong{background:var(--warn-soft);color:var(--warn);font-weight:700;border-radius:4px;padding:0 3px}
.marked .fix{color:var(--leaf);font-weight:600}
.note{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line)}
.note:first-of-type{border-top:0}
.note .kind{font-size:.78rem;font-weight:700;background:var(--lemon-soft);border-radius:6px;padding:2px 8px;align-self:start;white-space:nowrap}
.note .pair{font-weight:500}
.note .pair s{color:var(--warn);text-decoration-thickness:1.5px}
.note .pair span{color:var(--leaf)}
.note .why{grid-column:2;color:var(--ink-soft);font-size:.92rem}
.clean{font-family:"Instrument Serif",Georgia,serif;font-size:1.25rem;line-height:1.55;margin:0;white-space:pre-wrap}
.praise{margin:0;font-size:.98rem}

/* settings */
.gear{background:none;border:1.5px solid var(--line);border-radius:10px;padding:5px 10px;font-size:.88rem;font-weight:600;color:var(--ink)}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-weight:600;font-size:.92rem;margin-bottom:5px}
.field input,.field select{width:100%;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;padding:10px 12px}
.field small{display:block;color:var(--ink-soft);font-size:.85rem;margin-top:5px}
.field small a{color:var(--ink)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 18px;margin-bottom:16px}
.panel h2{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:1.7rem;margin:0 0 12px}
.panel p{margin:0 0 12px}
.tools{display:flex;gap:8px;margin-bottom:14px}
.tools .btn{flex:1;padding:9px}
.ok{color:var(--leaf)}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs .in{max-width:640px;margin:0 auto;display:flex}
nav.tabs button{flex:1;background:none;border:0;padding:12px 4px 14px;font-weight:600;font-size:.92rem;color:var(--ink-soft);position:relative}
nav.tabs button[aria-selected="true"]{color:var(--ink)}
nav.tabs button[aria-selected="true"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;background:var(--lemon);border-radius:0 0 3px 3px}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:999px;font-size:.92rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:6}
.toast.show{opacity:1}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Parola <i>quaderno</i></div>
    <div style="display:flex;gap:10px;align-items:center"><div class="count" id="count"></div><button class="gear" id="gear" type="button">Settings</button></div>
  </header>

  <!-- LOOKUP -->
  <section id="view-look">
    <form class="search" id="form" autocomplete="off">
      <input id="q" type="search" placeholder="Type an Italian word or phrase…" aria-label="Word to look up" enterkeyhint="search">
      <button class="btn" id="go" type="submit">Look up</button>
    </form>
    <p class="hint">You can also type a Spanish word to find the Italian one.</p>
    <div class="chips" id="tries"></div>
    <div id="out"></div>
  </section>

  <!-- CORRECT -->
  <section id="view-correct" hidden>
    <textarea class="essay" id="essay" placeholder="Paste or write your Italian text here…" aria-label="Your Italian text"></textarea>
    <div class="bar">
      <div class="grow" id="wc"></div>
      <button class="btn ghost" id="clear" type="button">Clear</button>
      <button class="btn" id="check" type="button">Correct</button>
    </div>
    <div id="corr"></div>
  </section>

  <!-- SAVED -->
  <section id="view-saved" hidden>
    <div class="tools">
      <button class="btn ghost" id="export" type="button">Export words</button>
      <button class="btn ghost" id="import" type="button">Import words</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
    <input class="filter" id="filter" type="search" placeholder="Filter saved words" aria-label="Filter saved words">
    <div id="list"></div>
  </section>

  <!-- SETTINGS -->
  <section id="view-settings" hidden>
    <div class="panel">
      <h2>AI connection</h2>
      <p class="meta">Parola uses your own API key. It stays on this device and is only sent to the provider you choose.</p>
      <label class="field"><span>Provider</span>
        <select id="prov">
          <option value="gemini">Google Gemini (free tier)</option>
          <option value="groq">Groq (free tier)</option>
          <option value="openrouter">OpenRouter</option>
          <option value="openai">OpenAI</option>
          <option value="anthropic">Anthropic (Claude)</option>
          <option value="custom">Custom (OpenAI-compatible, e.g. Ollama)</option>
        </select>
        <small id="provHelp"></small>
      </label>
      <label class="field"><span>API key</span>
        <input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="Paste your key">
      </label>
      <label class="field"><span>Model</span>
        <div style="display:flex;gap:8px">
          <input id="model" type="text" autocomplete="off" spellcheck="false" list="modelList" style="flex:1;min-width:0">
          <button class="btn ghost" id="findModels" type="button">Find models</button>
        </div>
        <datalist id="modelList"></datalist>
        <small id="modelHelp">Tap Find models to see the exact names your key can use, then pick one.</small>
      </label>
      <label class="field" id="baseWrap" hidden><span>Base URL</span>
        <input id="base" type="url" autocomplete="off" spellcheck="false" placeholder="http://localhost:11434/v1">
      </label>
      <div class="bar">
        <div class="grow" id="testOut"></div>
        <button class="btn ghost" id="test" type="button">Test</button>
        <button class="btn" id="saveSet" type="button">Save</button>
      </div>
    </div>
  </section>

  <!-- PRACTICE -->
  <section id="view-practice" hidden>
    <div class="modes" role="group" aria-label="Practice direction">
      <button data-mode="it" aria-pressed="true">Italian → Spanish</button>
      <button data-mode="es" aria-pressed="false">Spanish → Italian</button>
    </div>
    <div id="deck"></div>
  </section>
</div>

<nav class="tabs" role="tablist">
  <div class="in">
    <button role="tab" data-tab="look" aria-selected="true">Look up</button>
    <button role="tab" data-tab="correct" aria-selected="false">Correct</button>
    <button role="tab" data-tab="saved" aria-selected="false">Saved</button>
    <button role="tab" data-tab="practice" aria-selected="false">Practice</button>
  </div>
</nav>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  function el(tag, attrs = {}, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") n.className = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) n.append(k instanceof Node ? k : String(k));
    return n;
  }
  const toast = msg => { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1800); };
  const keyOf = w => w.trim().toLowerCase().replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-|-$/g, "").slice(0, 120) || "w";

  /* ---------- storage: this device ---------- */
  let words = {};            // key -> entry
  let store = null;          // {save, remove} backend
  const LS = "parola-words-v1";
  const lsLoad = () => { try { return JSON.parse(localStorage.getItem(LS) || "{}"); } catch { return {}; } };
  const lsSave = () => { try { localStorage.setItem(LS, JSON.stringify(words)); } catch {} };

  store = { save: async (k) => lsSave(), remove: async (k) => lsSave() };
  words = lsLoad();

  /* ---------- tabs ---------- */
  let tab = "look";
  document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => {
    tab = b.dataset.tab;
    document.querySelectorAll("nav.tabs button").forEach(x => x.setAttribute("aria-selected", x === b));
    $("#view-look").hidden = tab !== "look";
    $("#view-saved").hidden = tab !== "saved";
    $("#view-correct").hidden = tab !== "correct";
    $("#view-settings").hidden = true;
    $("#view-practice").hidden = tab !== "practice";
    if (tab === "saved") renderList();
    if (tab === "practice") startDeck();
    window.scrollTo(0, 0);
  }));

  function refreshAll() {
    const n = Object.keys(words).length;
    $("#count").textContent = n ? `${n} saved` : "";
    if (tab === "saved") renderList();
    if (current) renderEntry(current);
  }

  /* ---------- lookup ---------- */
  let current = null, ctl = null;

  /* ---------- AI providers ---------- */
  const PROVIDERS = {
    gemini:     { model: "gemini-3-flash-preview", help: 'Free key at <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a>. Newer free models are listed there too.' },
    groq:       { model: "llama-3.3-70b-versatile", base: "https://api.groq.com/openai/v1", help: 'Free key at <a href="https://console.groq.com/keys" target="_blank" rel="noopener">console.groq.com</a>.' },
    openrouter: { model: "google/gemini-2.5-flash", base: "https://openrouter.ai/api/v1", help: 'Key at <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">openrouter.ai</a>. Models ending in ":free" cost nothing.' },
    openai:     { model: "gpt-4o-mini", base: "https://api.openai.com/v1", help: 'Paid key at <a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener">platform.openai.com</a>.' },
    anthropic:  { model: "claude-haiku-4-5-20251001", help: 'Paid key at <a href="https://console.anthropic.com" target="_blank" rel="noopener">console.anthropic.com</a>.' },
    custom:     { model: "llama3.1", base: "http://localhost:11434/v1", help: "Any OpenAI-compatible server. For Ollama, start it with OLLAMA_ORIGINS=* so the browser can reach it." }
  };
  const SET = "parola-settings-v1";
  let settings = (() => { try { return JSON.parse(localStorage.getItem(SET) || "null"); } catch { return null; } })() || { provider: "gemini", key: "", model: "", base: "" };

  function unwrap(v, needKey) {
    if (Array.isArray(v) && v.length && typeof v[0] === "object") v = v[0];
    if (needKey && v && typeof v === "object" && !(needKey in v)) {
      const inner = Object.values(v).find(x => x && typeof x === "object" && !Array.isArray(x) && needKey in x);
      if (inner) v = inner;
    }
    return v;
  }
  function extractJSON(text, needKey) {
    const t = String(text || "").trim();
    const tries = [t];
    const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (fence) tries.push(fence[1]);
    const a = t.indexOf("{"), b = t.lastIndexOf("}"); if (a >= 0 && b > a) tries.push(t.slice(a, b + 1));
    for (const x of tries) { try { const v = unwrap(JSON.parse(x), needKey); if (!needKey || (v && needKey in v)) return v; } catch {} }
    throw { code: "invalid_json", raw: t };
  }

  async function ask(prompt, signal, opts = {}) {
    const cfg = { ...PROVIDERS[settings.provider], ...settings };
    const model = settings.model || PROVIDERS[settings.provider].model;
    if (!settings.key && settings.provider !== "custom") throw { code: "no_key" };
    let res, text;
    try {
      if (settings.provider === "gemini") {
        res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
          method: "POST", signal,
          headers: { "Content-Type": "application/json", "x-goog-api-key": settings.key },
          body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: prompt }] }], generationConfig: Object.assign({ responseMimeType: "application/json", temperature: 0.3, maxOutputTokens: 8192 }, opts.schema ? { responseSchema: opts.schema } : {}) })
        });
        const j = await res.json().catch(() => ({}));
        if (!res.ok) throw { code: res.status, message: j?.error?.message };
        const cand = j.candidates?.[0];
        text = (cand?.content?.parts || []).filter(p => !p.thought).map(p => p.text || "").join("");
        if (!text) throw { code: "empty", message: cand?.finishReason || j.promptFeedback?.blockReason || "no text" };
      } else if (settings.provider === "anthropic") {
        res = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST", signal,
          headers: { "Content-Type": "application/json", "x-api-key": settings.key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
          body: JSON.stringify({ model, max_tokens: 2000, messages: [{ role: "user", content: prompt }] })
        });
        const j = await res.json().catch(() => ({}));
        if (!res.ok) throw { code: res.status, message: j?.error?.message };
        text = (j.content || []).map(c => c.text || "").join("");
      } else {
        const base = (settings.provider === "custom" ? (settings.base || cfg.base) : PROVIDERS[settings.provider].base).replace(/\/$/, "");
        const headers = { "Content-Type": "application/json" };
        if (settings.key) headers.Authorization = `Bearer ${settings.key}`;
        if (settings.provider === "openrouter") { headers["HTTP-Referer"] = location.origin; headers["X-Title"] = "Parola"; }
        res = await fetch(`${base}/chat/completions`, {
          method: "POST", signal, headers,
          body: JSON.stringify(Object.assign({ model, temperature: 0.3, messages: [{ role: "user", content: prompt }] },
            (settings.provider === "openai" || settings.provider === "groq") ? { response_format: { type: "json_object" } } : {}))
        });
        const j = await res.json().catch(() => ({}));
        if (!res.ok) throw { code: res.status, message: j?.error?.message };

  function renderMarked(str) {
    const p = el("p", { class: "marked" });

  /* ---------- export / import ---------- */
  $("#export").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify({ app: "parola", version: 1, exported: new Date().toISOString(), words }, null, 2)], { type: "application/json" });
    const a = el("a", { href: URL.createObjectURL(blob), download: `parola-words-${new Date().toISOString().slice(0, 10)}.json` });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });
  $("#import").addEventListener("click", () => $("#importFile").click());
  $("#importFile").addEventListener("change", async e => {
    const f = e.target.files?.[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      const incoming = data.words || data;
      let n = 0;
      for (const [k, w] of Object.entries(incoming)) {
        if (!w || typeof w.word !== "string") continue;
        const old = words[k];
        if (!old || (w.due || 0) > (old.due || 0)) { words[k] = w; n++; }
      }
      lsSave(); refreshAll(); toast(`Imported ${n} word${n === 1 ? "" : "s"}`);
    } catch { toast("That file isn't a Parola export"); }
    e.target.value = "";
  });

  if (!settings.key && settings.provider !== "custom") setTimeout(() => toast("Add your API key in Settings to start"), 600);
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

  refreshAll();
})();
</script>
</body>
</html>
